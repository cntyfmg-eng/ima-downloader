<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root { --green: #00785A; --green-d: #005f47; --bg: #f4f7f6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 "Microsoft YaHei UI", sans-serif; background: var(--bg); color: #222; padding: 16px; }
  h1 { font-size: 18px; color: var(--green); margin-bottom: 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { font-size: 13px; color: #555; }
  input[type=text], input[type=password], select {
    padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: var(--green); }
  button {
    padding: 6px 14px; border: 0; border-radius: 6px; background: var(--green); color: #fff;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: var(--green-d); }
  button.gray { background: #8a9490; }
  button.gray:hover { background: #6f7a75; }
  #crumb { font-size: 13px; color: #555; margin: 6px 0; }
  #crumb a { color: var(--green); cursor: pointer; text-decoration: none; }
  #list { border: 1px solid #e3e8e6; border-radius: 8px; max-height: 46vh; overflow: auto; }
  .item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid #f0f3f2; cursor: default; }
  .item:hover { background: #f2f8f6; }
  .item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #e8f2ef; color: var(--green); flex-shrink: 0; }
  .tag.folder { background: #fdf3e3; color: #b8860b; }
  .tag.skip { background: #eee; color: #999; }
  .item.folder { cursor: pointer; }
  #log { height: 130px; overflow: auto; background: #0d1f1a; color: #9fe3c8; font: 12px/1.5 Consolas, monospace; border-radius: 8px; padding: 8px 10px; }
  .foot { text-align: center; color: #aaa; font-size: 12px; margin-top: 10px; }
  .badge { display: inline-block; background: var(--green); color: #fff; border-radius: 4px; font-size: 12px; padding: 0 6px; }
  .progress { font-size: 12px; color: var(--green); min-width: 90px; text-align: right; }
</style>
</head>
<body>
  <h1>ima知识库下载器 <span class="badge">ima 加载项版</span></h1>

      <button id="btnSave">保存凭证</button>
      <button id="btnClear" class="gray">清除凭证</button>

      <button id="btnAll" class="gray">全选</button>
      <button id="btnNone" class="gray">全不选</button>
      <button id="btnDown">下载勾选项</button>
      <span class="progress" id="prog"></span>

<script src="downloader.js"></script>

</html>
